<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ELMANAR Jewelry Boxes — Official Links</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold-light: #f5df9e;
      --gold-mid: #cfa861;
      --gold-deep: #9b7432;
      --gold-text: #c9a461;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      max-width: 100vw;
      overflow: hidden;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #070707;
      color: #ffffff;
      position: relative;
      -webkit-font-smoothing: antialiased;
    }

    /* Allow vertical scroll only on very short landscape viewports */
    @media (max-height: 600px) {
      html, body {
        height: auto;
        min-height: 100dvh;
        overflow-y: auto;
        overflow-x: hidden;
      }
    }

    /* 100% Vector + Procedural High-Definition Black & Gold Marble Background (Zero Pixels on Zoom) */
    .marble-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse at 50% 10%, rgba(218, 175, 96, 0.14) 0%, rgba(0, 0, 0, 0) 58%),
        radial-gradient(ellipse at 12% 48%, rgba(190, 148, 72, 0.08) 0%, rgba(0, 0, 0, 0) 50%),
        radial-gradient(ellipse at 85% 82%, rgba(185, 142, 68, 0.08) 0%, rgba(0, 0, 0, 0) 55%),
        linear-gradient(165deg, #101010 0%, #070707 42%, #0a0908 72%, #050505 100%);
      pointer-events: none;
      overflow: hidden;
    }

    .marble-vector-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* Main responsive container that fits 100dvh without overflow */
    .page-shell {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 410px;
      height: 100dvh;
      margin: 0 auto;
      padding: clamp(8px, 1.8dvh, 18px) 16px clamp(10px, 2dvh, 20px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    @media (max-height: 600px) {
      .page-shell {
        height: auto;
        min-height: 100dvh;
        gap: 16px;
      }
    }

    /* Crisp Infinite-Resolution Vector Logo Lockup */
    .brand-logo-svg {
      width: clamp(210px, 64vw, 275px);
      max-height: clamp(125px, 21dvh, 185px);
      height: auto;
      display: block;
      margin: 0 auto;
      filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.9));
      overflow: visible;
    }

    .tagline-text {
      margin: clamp(3px, 0.7dvh, 8px) 0 clamp(6px, 1.4dvh, 14px);
      font-size: clamp(11.5px, 3.2vw, 13.5px);
      letter-spacing: 0.01em;
      color: #dedede;
      font-weight: 400;
      line-height: 1.3;
      text-align: center;
      white-space: nowrap;
    }

    /* Link Cards List */
    .links-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: clamp(6px, 1.15dvh, 11px);
    }

    /* Link Card matching Desgin.jpg */
    .link-card {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
      padding: clamp(7px, 1.15dvh, 11px) 16px clamp(7px, 1.15dvh, 11px) 12px;
      border-radius: 23px;
      background: linear-gradient(135deg, rgba(54, 46, 35, 0.84) 0%, rgba(29, 26, 21, 0.90) 55%, rgba(42, 36, 27, 0.86) 100%);
      border: 1.4px solid rgba(198, 160, 94, 0.56);
      box-shadow:
        0 6px 18px rgba(0, 0, 0, 0.65),
        inset 0 1px 1px rgba(255, 232, 185, 0.24),
        inset 0 -1px 2px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      text-decoration: none;
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1),
                  border-color 0.2s ease,
                  box-shadow 0.2s ease,
                  background 0.2s ease;
    }

    .link-card:hover,
    .link-card:focus-visible {
      transform: translateY(-1.5px) scale(1.008);
      border-color: rgba(238, 200, 126, 0.9);
      background: linear-gradient(135deg, rgba(66, 56, 42, 0.90) 0%, rgba(36, 32, 25, 0.94) 55%, rgba(50, 42, 31, 0.90) 100%);
      box-shadow:
        0 10px 24px rgba(0, 0, 0, 0.78),
        0 0 16px rgba(209, 169, 98, 0.22),
        inset 0 1px 2px rgba(255, 236, 195, 0.38);
      outline: none;
    }

    .link-card:active {
      transform: translateY(0) scale(0.992);
    }

    /* Left rounded square icon badge */
    .icon-badge {
      width: clamp(40px, 5.6dvh, 48px);
      height: clamp(40px, 5.6dvh, 48px);
      min-width: clamp(40px, 5.6dvh, 48px);
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 32% 28%, rgba(116, 92, 54, 0.56) 0%, rgba(44, 37, 26, 0.86) 62%, rgba(26, 22, 16, 0.96) 100%);
      border: 1.15px solid rgba(208, 171, 105, 0.5);
      box-shadow:
        inset 0 1px 2px rgba(255, 232, 184, 0.28),
        0 3px 7px rgba(0, 0, 0, 0.45);
      margin-right: 14px;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .icon-badge svg {
      width: clamp(21px, 3dvh, 25px);
      height: clamp(21px, 3dvh, 25px);
    }

    .link-card:hover .icon-badge {
      border-color: rgba(240, 204, 136, 0.82);
      transform: scale(1.04);
    }

    .card-title {
      color: #ffffff;
      font-size: clamp(0.95rem, 2.1dvh, 1.08rem);
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: 0.01em;
    }

    .card-subtitle {
      color: #c8a362;
      font-size: clamp(0.75rem, 1.6dvh, 0.84rem);
      font-weight: 400;
      line-height: 1.25;
      margin-top: 2px;
    }

    .chevron-icon {
      margin-left: auto;
      padding-left: 8px;
      color: #bfa065;
      transition: transform 0.2s ease, color 0.2s ease;
    }

    .link-card:hover .chevron-icon {
      transform: translateX(3px);
      color: #f0d493;
    }

    /* Bottom Footer Gold Square Icons */
    .footer-social-btn {
      width: clamp(26px, 3.8dvh, 30px);
      height: clamp(26px, 3.8dvh, 30px);
      border-radius: 7px;
      background: linear-gradient(145deg, #e2c385 0%, #c19b56 50%, #9b7637 100%);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #14110b;
      box-shadow:
        0 3px 8px rgba(0, 0, 0, 0.6),
        inset 0 1px 1px rgba(255, 245, 214, 0.62);
      transition: transform 0.18s ease, filter 0.18s ease, box-shadow 0.18s ease;
      text-decoration: none;
    }

    .footer-social-btn:hover,
    .footer-social-btn:focus-visible {
      transform: translateY(-2px) scale(1.07);
      filter: brightness(1.1);
      box-shadow:
        0 5px 12px rgba(209, 169, 98, 0.35),
        inset 0 1px 1px rgba(255, 245, 214, 0.82);
      outline: none;
    }

    /* Toast notification */
    #status-toast {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: rgba(24, 20, 15, 0.96);
      border: 1px solid rgba(212, 173, 102, 0.72);
      color: #f3dc9f;
      padding: 7px 14px;
      border-radius: 9999px;
      font-size: 0.75rem;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.8);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease, transform 0.22s ease;
      z-index: 50;
      white-space: nowrap;
      max-width: 90vw;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #status-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <!-- Shared Metallic Gold & Marble Vector Definitions -->
  <svg width="0" height="0" class="absolute" aria-hidden="true">
    <defs>
      <!-- Rich 3D Metallic Gold Gradient for Emblem & Icons -->
      <linearGradient id="goldMetallic" x1="12%" y1="6%" x2="88%" y2="94%">
        <stop offset="0%" stop-color="#fff2be" />
        <stop offset="22%" stop-color="#e5c178" />
        <stop offset="48%" stop-color="#b98e46" />
        <stop offset="72%" stop-color="#f2d694" />
        <stop offset="100%" stop-color="#8f6726" />
      </linearGradient>

      <!-- Warm Vertical 3D Gold Gradient for Typography -->
      <linearGradient id="goldTextGrad" x1="50%" y1="0%" x2="50%" y2="100%">
        <stop offset="0%" stop-color="#fff3c4" />
        <stop offset="38%" stop-color="#dfb870" />
        <stop offset="75%" stop-color="#b5893e" />
        <stop offset="100%" stop-color="#8a6220" />
      </linearGradient>

      <!-- Beveled Gold Ring Gradient -->
      <linearGradient id="goldRingOuter" x1="20%" y1="0%" x2="80%" y2="100%">
        <stop offset="0%" stop-color="#fae4a7" />
        <stop offset="35%" stop-color="#cba258" />
        <stop offset="65%" stop-color="#966e2a" />
        <stop offset="100%" stop-color="#e8c680" />
      </linearGradient>

      <!-- Marble Gold Vein Gradients -->
      <linearGradient id="veinGrad1"><stop offset="0%" stop-color="#d8b574"/></linearGradient>
      <linearGradient id="veinGoldBright" x1="0%" y1="100%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#7c5a22" stop-opacity="0.25" />
        <stop offset="28%" stop-color="#dfb870" stop-opacity="0.65" />
        <stop offset="50%" stop-color="#fff0bc" stop-opacity="0.82" />
        <stop offset="75%" stop-color="#c4984e" stop-opacity="0.58" />
        <stop offset="100%" stop-color="#6e4e1c" stop-opacity="0.2" />
      </linearGradient>

      <linearGradient id="veinSmoke" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.09" />
        <stop offset="45%" stop-color="#b8b2a6" stop-opacity="0.16" />
        <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04" />
      </linearGradient>

      <filter id="smokeBlur" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" />
      </filter>

      <filter id="veinGlow" x="-10%" y="-10%" width="120%" height="120%">
        <feGaussianBlur stdDeviation="1.4" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
    </defs>
  </svg>

  <!-- 100% Vector Luxury Black & Gold Marble Background (Zero Pixels on Any Zoom) -->
  <div class="marble-bg">
    <svg class="marble-vector-canvas" viewBox="0 0 600 1200" preserveAspectRatio="xMidYMid slice" aria-hidden="true">

  <!-- Subtle status toast when testing links -->
  <div id="status-toast" role="status" aria-live="polite"></div>

  <script>
    (function () {
      const toast = document.getElementById('status-toast');
      let toastTimer = null;

      function showToast(message) {
        if (!toast) return;
        toast.textContent = message;
        toast.classList.add('show');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          toast.classList.remove('show');
        }, 2400);
      }

      const allLinks = document.querySelectorAll('a[data-platform]');
      allLinks.forEach(function (link) {
        link.addEventListener('click', function () {
          const platform = link.getAttribute('data-platform') || 'Link';
          const href = link.getAttribute('href') || '';
          showToast('Opening ' + platform + ' (' + href + ')');
        });
      });
    })();
  </script>
